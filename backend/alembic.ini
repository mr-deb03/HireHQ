[alembic]
script_location = alembic
prepend_sys_path = .
# Timestamped revision filenames sort chronologically in a directory listing, which
# matters once a team has dozens of migrations.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

# sqlalchemy.url is set at runtime from DATABASE_URL in alembic/env.py, so credentials
# never live in a checked-in file.

# No post-write hooks: a formatter that is not installed must not make
# `alembic revision` fail. Format migrations with the project's normal tooling.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
