# Render Blueprint — defines both backend services in one file.
#
# Render reads this from the repository root. Point a Blueprint at your repo and it
# creates the API and the worker together.
#
# The frontend is NOT here: it goes on Vercel. See DEPLOY-SIMPLE.md or DEPLOYMENT.md.
#
# ---------------------------------------------------------------------------------
# Two Render rules shape the layout below, and getting them wrong means the services
# start with NO configuration at all:
#
#   1. `envVarGroups` accept only literal key/value pairs. `sync: false` and
#      `generateValue` are service-level features and do not work inside a group.
#   2. Secrets therefore live on each service, marked `sync: false` so Render prompts
#      for them at deploy time and keeps them out of git.
#
# JWT_SECRET is generated once on the API and pulled into the worker by reference, so
# the two can never drift apart. That matters: it signs sessions AND derives the
# encryption key for stored OAuth tokens, so a mismatch would leave the worker unable
# to decrypt what the API wrote.
# ---------------------------------------------------------------------------------

envVarGroups:
  # Non-secret settings, identical on both services. Literal values only.
  - name: hirehq-config
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_JSON
        value: "true"

      - key: USE_REDIS_QUEUE
        value: "true"
      - key: USE_REDIS_CACHE
        value: "true"

      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_BUCKET
        value: hirehq
      - key: STORAGE_REGION
        value: auto
      # Cloudflare R2 encrypts automatically and REJECTS this header, so it is empty.
      # For AWS S3 or MinIO, set it to AES256 and put your real region above.
      - key: STORAGE_SERVER_SIDE_ENCRYPTION
        value: ""

services:
  # ------------------------------------------------------------------------ API
  - type: web
    name: hirehq-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    # Liveness only - it does not touch the database, so a slow query or a sleeping
    # Neon instance cannot make Render think the service is dead and restart it.
    healthCheckPath: /health/live
    envVars:
      - fromGroup: hirehq-config

      # Generated by Render on first deploy. You never see or set it.
      - key: JWT_SECRET
        generateValue: true

      # Render injects PORT; the Dockerfile CMD reads it. Two uvicorn workers fit
      # comfortably in a starter instance. Raise this with the instance size, not past it.
      - key: WEB_CONCURRENCY
        value: "2"

      # ---- prompted at deploy time, never stored in git
      # Postgres: must use the +asyncpg driver and must NOT carry ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      # Redis: Upstash gives a rediss:// URL; ARQ reads TLS from that scheme.
      - key: REDIS_URL
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      # This service's own public URL, e.g. https://hirehq-api.onrender.com.
      # It builds the OAuth redirect URIs, so it must be exact.
      - key: BACKEND_BASE_URL
        sync: false
      # The Vercel URL. You will not know it until the frontend is deployed - the guide
      # uses a placeholder here and comes back to correct it.
      - key: FRONTEND_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # --------------------------------------------------------------------- worker
  # Same image, same configuration, different start command. Without this: résumés
  # never parse, ATS scores never appear, reminders never send, mailbox sync never runs.
  - type: worker
    name: hirehq-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    dockerCommand: arq app.workers.worker.WorkerSettings
    envVars:
      - fromGroup: hirehq-config

      # Pulled from the API so both always agree. Do not replace with generateValue -
      # that would mint a second, different secret.
      - key: JWT_SECRET
        fromService:
          type: web
          name: hirehq-api
          envVarKey: JWT_SECRET

      # The worker talks to the same database, queue and bucket, and builds
      # candidate-facing links in the emails it sends.
      - key: DATABASE_URL
        fromService:
          type: web
          name: hirehq-api
          envVarKey: DATABASE_URL
      - key: REDIS_URL
        fromService:
          type: web
          name: hirehq-api
          envVarKey: REDIS_URL
      - key: STORAGE_ENDPOINT
        fromService:
          type: web
          name: hirehq-api
          envVarKey: STORAGE_ENDPOINT
      - key: STORAGE_ACCESS_KEY
        fromService:
          type: web
          name: hirehq-api
          envVarKey: STORAGE_ACCESS_KEY
      - key: STORAGE_SECRET_KEY
        fromService:
          type: web
          name: hirehq-api
          envVarKey: STORAGE_SECRET_KEY
      - key: BACKEND_BASE_URL
        fromService:
          type: web
          name: hirehq-api
          envVarKey: BACKEND_BASE_URL
      - key: FRONTEND_BASE_URL
        fromService:
          type: web
          name: hirehq-api
          envVarKey: FRONTEND_BASE_URL
